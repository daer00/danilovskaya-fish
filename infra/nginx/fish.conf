# Даниловская рыба — Nginx на Beget VPS
# Установка:
#   sudo cp infra/nginx/fish.conf /etc/nginx/sites-available/fish
#   sudo ln -sf /etc/nginx/sites-available/fish /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fish.example.ru
#
# Замените fish.example.ru на ваш домен.

server {
    listen 80;
    listen [::]:80;
    server_name fish.example.ru;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
