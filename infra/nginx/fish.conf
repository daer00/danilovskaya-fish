# Даниловская рыба — Nginx на Beget VPS
# sudo certbot --nginx -d danilovskayaryba.ru -d www.danilovskayaryba.ru
#
# После certbot обычно появляются listen 443 и ssl_certificate — не затирайте их вручную,
# только добавьте server_name www и редирект, если certbot сам не сделал.

# HTTP → HTTPS (оба имени)
server {
    listen 80;
    listen [::]:80;
    server_name danilovskayaryba.ru www.danilovskayaryba.ru;
    return 301 https://danilovskayaryba.ru$request_uri;
}

# www → без www (нужен сертификат с SAN на www)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.danilovskayaryba.ru;
    # ssl_certificate / ssl_certificate_key — проставит certbot
    return 301 https://danilovskayaryba.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name danilovskayaryba.ru;
    # ssl_certificate / ssl_certificate_key — проставит certbot

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
