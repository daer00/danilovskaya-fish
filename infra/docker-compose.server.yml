# Beget / VPS. Пример:
# docker compose -p fish --env-file .env.server -f docker-compose.server.yml --profile bots up -d --build
name: fish

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: .env.server
    environment:
      WEBROOT: /app/webroot
      WEBROOT_ADMIN: /app/webroot-admin
      MEDIA_ROOT: /app/media
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - ./webroot:/app/webroot:ro
      - ./webroot-admin:/app/webroot-admin:ro
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: bots/Dockerfile
    profiles: ["bots"]
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      TG_PROXY: ${TG_PROXY:-}
      BACKEND_URL: http://backend:8000/api/v1
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      REDIS_URL: redis://redis:6379/1
      WEBAPP_URL: ${WEBAPP_URL:-}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
